name: Build JR SMS Manager APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "Android SDK not found"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          if test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager missing"; exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JR-SMS-Manager-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
